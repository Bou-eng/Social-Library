{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Şifre Sıfırlama</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="{% static 'accounts/register.css' %}">
</head>
<body class="register-page">
  <div class="login-container">
    <div class="brand-logo">
      <div class="brand-icon">📚</div>
      <div class="brand-text"><span class="line1">Sosyal</span><span class="line2">Kütüphanem</span></div>
    </div>

    <div class="login-card">
      <h1 class="login-title">Şifre Sıfırlama</h1>

      {% if messages %}
        <div>
          {% for message in messages %}
            <div class="server-alert alert-{{ message.tags }}" role="alert">
              <div class="alert-icon">!</div>
              <div class="alert-body">{{ message }}</div>
            </div>
          {% endfor %}
        </div>
      {% endif %}

      <form method="POST" action="" novalidate>
        {% csrf_token %}
        <div class="mb-3">
          <label for="email" class="form-label">E-posta</label>
          <div class="input-wrapper">
            <input type="email" id="email" name="email" class="form-control" placeholder="example@example.com" required />
            <div class="invalid-feedback">Lütfen geçerli bir e-posta girin.</div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-login">Kodu Gönder</button>
      </form>

      <div class="bottom-text">Geriye dön: <a href="{% url 'login' %}" class="register-link">Giriş yap</a></div>
    </div>
  </div>
</body>
</html>
