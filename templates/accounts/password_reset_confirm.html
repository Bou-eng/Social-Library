{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Yeni Şifre</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="{% static 'accounts/register.css' %}">
</head>
<body class="register-page">
  <div class="login-container">
    <div class="brand-logo">
      <div class="brand-icon">📚</div>
      <div class="brand-text"><span class="line1">Sosyal</span><span class="line2">Kütüphanem</span></div>
    </div>

    <div class="login-card">
      <h1 class="login-title">Yeni Şifre Belirle</h1>

      {% if messages %}
        <div>
          {% for message in messages %}
            <div class="server-alert alert-{{ message.tags }}" role="alert">
              <div class="alert-icon">!</div>
              <div class="alert-body">{{ message }}</div>
            </div>
          {% endfor %}
        </div>
      {% endif %}

      <form method="POST" action="" novalidate>
        {% csrf_token %}

        <div class="mb-3">
          <label for="password" class="form-label">Yeni Şifre</label>
          <div class="password-wrapper">
            <input type="password" id="password" name="password" class="form-control" placeholder="Yeni şifre" required minlength="6" />
            <span class="toggle-password" id="togglePassword1">Göster</span>
          </div>
          <div class="invalid-feedback">Lütfen yeni şifrenizi girin.</div>
        </div>

        <div class="mb-3">
          <label for="password2" class="form-label">Yeni Şifre (Tekrar)</label>
          <div class="password-wrapper">
            <input type="password" id="password2" name="password2" class="form-control" placeholder="Yeni şifre (Tekrar)" required minlength="6" />
            <span class="toggle-password" id="togglePassword2">Göster</span>
          </div>
          <div class="invalid-feedback">Lütfen şifreyi tekrar girin.</div>
        </div>

        <button type="submit" class="btn btn-primary btn-login">Şifreyi Değiştir</button>
      </form>

      <div class="bottom-text">Geriye dön: <a href="{% url 'login' %}" class="register-link">Giriş yap</a></div>
    </div>
  </div>

  <script>
    // small toggle script for confirm page
    const t1 = document.getElementById('togglePassword1');
    const p1 = document.getElementById('password');
    if (t1 && p1) {
      t1.addEventListener('click', () => {
        const type = p1.getAttribute('type') === 'password' ? 'text' : 'password';
        p1.setAttribute('type', type);
        t1.textContent = type === 'password' ? 'Göster' : 'Gizle';
      });
    }

    const t2 = document.getElementById('togglePassword2');
    const p2 = document.getElementById('password2');
    if (t2 && p2) {
      t2.addEventListener('click', () => {
        const type = p2.getAttribute('type') === 'password' ? 'text' : 'password';
        p2.setAttribute('type', type);
        t2.textContent = type === 'password' ? 'Göster' : 'Gizle';
      });
    }
  </script>
</body>
</html>
